# Tiny Tapeout project information
project:
  title: "Decimal Code Lab"
  author: "Susie Maestre"
  discord: ""
  description: "Decimal <-> BCD/2421/5421/84-2-1/7421/Excess-3/Gray/cyclic-Gray converter with 9's complement, decade counter, code museum, 7-segment view and binary-to-BCD."
  language: "Verilog"
  clock_hz: 10000000
  tiles: "1x1"          # raise to "1x2" if the flow reports the design does not fit
  top_module: "tt_um_decimal_code_lab"
  source_files:
    - "project.v"

# Pin names. uo[7:0] depends on VIEW (ui[7]): code view / 7-segment view.
pinout:
  ui[0]: "D0 data nibble"
  ui[1]: "D1 data nibble"
  ui[2]: "D2 data nibble"
  ui[3]: "D3 data nibble"
  ui[4]: "M0 code select"
  ui[5]: "M1 code select"
  ui[6]: "M2 code select"
  ui[7]: "VIEW 0=code view, 1=7-segment view"

  uo[0]: "nibble0 / seg a"
  uo[1]: "nibble1 / seg b"
  uo[2]: "nibble2 / seg c"
  uo[3]: "nibble3 / seg d"
  uo[4]: "aux0 / seg e"
  uo[5]: "aux1 / seg f"
  uo[6]: "aux2 / seg g"
  uo[7]: "multi-bit-flip flag / decimal point = invalid"

  uio[0]: "F0 function"
  uio[1]: "F1 function"
  uio[2]: "F2 function"
  uio[3]: "SPD0 step rate"
  uio[4]: "SPD1 step rate"
  uio[5]: "NINES 9's complement / count down"
  uio[6]: "selfcomp (output): selected code is self-complementing"
  uio[7]: "invalid (output)"

yaml_version: 6
